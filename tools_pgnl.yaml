sources:
  my-pg-source:
    kind: postgres
    host: 127.0.0.1
    port: 5434
    database: toolbox_db
    user: toolbox_user
    password: my-password
tools:
  natural-language-question-to-db:
    kind: postgres-nl
    source: my-pg-source
    description: "Convert natural language questions to SQL queries for PostgreSQL database"
    parameters:
      - name: question
        type: string
        description: The natural language question to convert to SQL.

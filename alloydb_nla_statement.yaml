sources:
  my-alloydb-source:
    kind: alloydb-postgres
    project: hailongli-senseai
    region: us-central1
    cluster: hailong-test
    instance: hailong-test-primary
    database: assistantdemo
    user: toolbox_user
    password: my-password
authServices:
  my_google_service:
    kind: google
    clientId: 247162760317-9hj60rv6divcnaq0ghgdm40hn37dne2m.apps.googleusercontent.com
tools:
  ask_questions:
    kind: postgres-sql
    source: my-alloydb-source
    description: "Ask questions to check information about flights, airpots, and airlines etc."
    statement: SELECT alloydb_ai_nl.execute_nl_query($1, 'cymbal_air_nl_config', param_names => ARRAY ['user_email'], param_values => ARRAY [$2]);
    parameters:
      - name: question
        type: string
        description: The natural language question to ask.
      - name: user_email
        type: string
        description: User ID of the logged in user.
        authServices:
          - name: my_google_service
            field: email
